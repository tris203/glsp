name: Generate

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install dependencies
        run: go mod download

      - name: Run go generate
        run: go generate ./...

      - name: Check for uncommitted changes
        run: |
          if ! git diff --exit-code; then
            echo "::error::Go generate created changes. Please run 'go generate ./...' and commit the changes."
            exit 1
          fi
